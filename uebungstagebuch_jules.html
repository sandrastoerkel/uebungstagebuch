<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Übungstagebuch</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #D4A017;
    --gold-light: #F5D060;
    --gold-glow: #FFF3C4;
    --parchment: #FFFDF7;
    --ink: #3B2F1E;
    --ink-soft: #7A6B55;
    --accent: #4A7C59;
    --accent-soft: #E5F5EC;
    --coral: #E07A5F;
    --blue: #2D7D9A;
    --shadow: rgba(59,47,30,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    background: var(--parchment);
    min-height: 100vh;
    padding: 1.5rem;
    background-image:
      radial-gradient(ellipse at 15% 85%, rgba(212,160,23,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 15%, rgba(74,124,89,0.05) 0%, transparent 50%);
  }

  .page { max-width: 560px; margin: 0 auto; }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: white;
    padding: 0.3rem 1rem;
    border-radius: 30px;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.6rem;
    box-shadow: 0 3px 10px rgba(212,160,23,0.3);
  }

  .header h1 {
    font-family: 'Caveat', cursive;
    font-size: 2.2rem;
    line-height: 1.1;
  }

  .header h1 span {
    background: linear-gradient(135deg, var(--accent), #6AAF7A);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .child-name {
    font-size: 1rem;
    color: var(--ink-soft);
    margin-top: 0.3rem;
  }

  .child-name strong {
    color: var(--accent);
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    cursor: pointer;
    border-bottom: 2px dashed var(--accent);
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: white;
    border-radius: 12px;
    padding: 0.7rem 0.5rem;
    text-align: center;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .stat-card .stat-icon { font-size: 1.2rem; margin-bottom: 0.15rem; }
  .stat-card .stat-value { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  .stat-card .stat-label { font-size: 0.65rem; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-card:nth-child(2) .stat-value { color: var(--blue); }

  /* ── Entry form ── */
  .entry-form {
    background: white;
    border-radius: 16px;
    padding: 1.3rem;
    box-shadow: 0 3px 15px var(--shadow);
    margin-bottom: 1.5rem;
    border: 2px solid var(--gold-glow);
  }

  .form-title {
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    color: var(--gold);
    margin-bottom: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .form-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 0.8rem;
  }

  .form-row label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ink-soft);
    min-width: 70px;
  }

  .form-row input[type="date"],
  .form-row input[type="number"] {
    flex: 1;
    border: 2px solid #EDE6D8;
    border-radius: 8px;
    padding: 0.45rem 0.6rem;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    background: var(--parchment);
  }

  .form-row input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }

  /* ── Mood picker ── */
  .mood-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .mood-row label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ink-soft);
    min-width: 70px;
  }

  .mood-options { display: flex; gap: 0.3rem; }

  .mood-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid #EDE6D8;
    background: white;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mood-btn:hover { transform: scale(1.15); border-color: var(--gold); }
  .mood-btn.active {
    border-color: var(--gold);
    background: var(--gold-glow);
    transform: scale(1.15);
    box-shadow: 0 2px 8px rgba(212,160,23,0.3);
  }

  .btn-save {
    width: 100%;
    padding: 0.7rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #5EAA72);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }

  .btn-save:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(74,124,89,0.4); }

  /* ── Log table ── */
  .log-section {
    background: white;
    border-radius: 16px;
    padding: 1.3rem;
    box-shadow: 0 3px 15px var(--shadow);
    margin-bottom: 1.5rem;
  }

  .log-title {
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    color: var(--ink);
    margin-bottom: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .log-empty {
    text-align: center;
    color: var(--ink-soft);
    font-style: italic;
    padding: 2rem 1rem;
    font-size: 0.88rem;
  }

  .log-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 0.4rem;
  }

  .log-table th {
    font-size: 0.65rem;
    font-weight: 800;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-align: left;
    padding: 0.3rem 0.5rem;
  }

  .log-table td {
    background: var(--parchment);
    padding: 0.55rem 0.5rem;
    font-size: 0.82rem;
    font-weight: 600;
  }

  .log-table tr td:first-child { border-radius: 8px 0 0 8px; }
  .log-table tr td:last-child { border-radius: 0 8px 8px 0; }

  .log-table .min-app { color: var(--accent); font-weight: 800; }
  .log-table .min-read { color: var(--blue); font-weight: 800; }
  .log-table .mood-cell { font-size: 1.1rem; text-align: center; }

  .delete-btn {
    background: none;
    border: none;
    color: #CCC;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 0.2rem;
    transition: color 0.2s;
  }

  .delete-btn:hover { color: var(--coral); }

  /* ── Action buttons ── */
  .actions {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .btn-action {
    padding: 0.5rem 1rem;
    border: 2px solid #EDE6D8;
    border-radius: 10px;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .btn-action:hover { border-color: var(--gold); background: var(--gold-glow); }
  .btn-action.danger:hover { border-color: var(--coral); color: var(--coral); background: #FFF0EB; }

  footer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--ink-soft);
    opacity: 0.5;
  }

  /* ── Cloud status ── */
  .cloud-status {
    position: fixed;
    top: 0.6rem;
    right: 0.6rem;
    padding: 0.25rem 0.7rem;
    border-radius: 20px;
    font-size: 0.68rem;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    z-index: 100;
    transition: all 0.3s;
    opacity: 0.85;
  }
  .cloud-status.syncing { background: var(--accent-soft); color: var(--accent); }
  .cloud-status.saved { background: #E5F8E5; color: #3A8A3A; }
  .cloud-status.offline { background: #FFF3E0; color: #C77700; }
  .cloud-status.error { background: #FFE8E5; color: var(--coral); }

  @media print {
    body { background: white; padding: 0.5cm; }
    .entry-form, .actions, .cloud-status { display: none !important; }
    .stat-card, .log-table td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="cloud-status" id="cloudStatus"></div>
<div class="page">

  <div class="header">
    <div class="header-badge">⭐ Schatzkarte Lerncoaching</div>
    <h1>📓 Mein <span>Übungstagebuch</span></h1>
    <div class="child-name">für <strong id="childNameDisplay" onclick="changeName()">Name eingeben</strong></div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-icon">📱</div>
      <div class="stat-value" id="statWeekApp">0</div>
      <div class="stat-label">App Min/Woche</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📖</div>
      <div class="stat-value" id="statWeekRead">0</div>
      <div class="stat-label">Lesen Min/Woche</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔥</div>
      <div class="stat-value" id="statStreak">0</div>
      <div class="stat-label">Tage in Folge</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📊</div>
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Einträge</div>
    </div>
  </div>

  <div class="entry-form">
    <div class="form-title">✏️ Neuer Eintrag</div>
    <div class="form-row">
      <label>📅 Datum</label>
      <input type="date" id="entryDate" />
    </div>
    <div class="form-row">
      <label>📱 App</label>
      <input type="number" id="entryApp" min="0" max="120" placeholder="Minuten" />
    </div>
    <div class="form-row">
      <label>📖 Lesen</label>
      <input type="number" id="entryRead" min="0" max="120" placeholder="Minuten" />
    </div>
    <div class="mood-row">
      <label>😊 Stimmung</label>
      <div class="mood-options" id="moodPicker">
        <button class="mood-btn" data-mood="😫" onclick="pickMood(this)">😫</button>
        <button class="mood-btn" data-mood="😐" onclick="pickMood(this)">😐</button>
        <button class="mood-btn" data-mood="🙂" onclick="pickMood(this)">🙂</button>
        <button class="mood-btn" data-mood="😊" onclick="pickMood(this)">😊</button>
        <button class="mood-btn" data-mood="🤩" onclick="pickMood(this)">🤩</button>
      </div>
    </div>
    <button class="btn-save" onclick="saveEntry()">💾 Eintrag speichern</button>
  </div>

  <div class="log-section">
    <div class="log-title">📋 Meine Einträge</div>
    <div id="logContent"></div>
  </div>

  <div class="actions">
    <button class="btn-action" onclick="exportJSON()">📤 Daten exportieren</button>
    <button class="btn-action" onclick="document.getElementById('importFile').click()">📥 Daten importieren</button>
    <button class="btn-action danger" onclick="clearAll()">🗑️ Alles löschen</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)" />
  </div>

  <footer>Schatzkarte Lerncoaching · Übungstagebuch</footer>
</div>

<script>
// ════════════════════════════════════════════════════
// KONFIGURATION: Hier die URL deiner Google Apps Script Web-App eintragen
// ════════════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUXthlkj_qnzdzrxiyzeFmhpd_awHtZ6WegyfJGvYmbb54ln7tHbsbtxuNkT5dltU/exec';
const SHEET_NAME = 'Jules';
// ════════════════════════════════════════════════════

const STORAGE_KEY = 'schatzkarte_tagebuch_jules';
let selectedMood = null;

document.getElementById('entryDate').valueAsDate = new Date();
loadName();
render();
syncFromCloud();

// ── Cloud Status ──
function showCloudStatus(type, text) {
  const el = document.getElementById('cloudStatus');
  el.className = 'cloud-status ' + type;
  el.textContent = text;
  el.style.display = 'block';
  if (type === 'saved') {
    setTimeout(() => { el.style.display = 'none'; }, 2500);
  }
}

// ── Cloud Sync ──
function isCloudEnabled() { return SCRIPT_URL && SCRIPT_URL.length > 10; }

async function cloudPost(payload) {
  if (!isCloudEnabled()) return;
  try {
    showCloudStatus('syncing', '☁️ Speichere...');
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ ...payload, sheet: SHEET_NAME }),
    });
    if (res.ok) {
      showCloudStatus('saved', '☁️ Gespeichert');
    } else {
      showCloudStatus('error', '⚠️ Cloud-Fehler');
    }
  } catch {
    showCloudStatus('offline', '📴 Offline');
  }
}

async function syncFromCloud() {
  if (!isCloudEnabled()) {
    showCloudStatus('offline', '📴 Nur lokal');
    setTimeout(() => { document.getElementById('cloudStatus').style.display = 'none'; }, 2000);
    return;
  }
  try {
    showCloudStatus('syncing', '☁️ Synchronisiere...');
    const res = await fetch(SCRIPT_URL + '?sheet=' + SHEET_NAME);
    if (!res.ok) { showCloudStatus('error', '⚠️ Cloud-Fehler'); return; }
    const data = await res.json();
    if (!data.entries) { showCloudStatus('error', '⚠️ Keine Daten'); return; }

    // Merge: Cloud entries win for same date, add unique local entries
    const localEntries = getEntries();
    const cloudEntries = data.entries;

    const merged = new Map();
    cloudEntries.forEach(e => merged.set(e.date, e));
    localEntries.forEach(e => { if (!merged.has(e.date)) merged.set(e.date, e); });

    const result = Array.from(merged.values()).sort((a, b) => b.date.localeCompare(a.date));
    saveEntries(result);

    // Sync name
    if (data.name && data.name.trim()) {
      const localName = localStorage.getItem(STORAGE_KEY + '_name');
      if (!localName || localName === 'Name eingeben') {
        localStorage.setItem(STORAGE_KEY + '_name', data.name);
        document.getElementById('childNameDisplay').textContent = data.name;
      }
    }

    render();
    showCloudStatus('saved', '☁️ Synchronisiert');
  } catch {
    showCloudStatus('offline', '📴 Offline');
  }
}

// ── Name ──
function loadName() {
  const n = localStorage.getItem(STORAGE_KEY + '_name') || 'Name eingeben';
  document.getElementById('childNameDisplay').textContent = n;
}

function changeName() {
  const n = prompt('Wie heißt du?');
  if (n && n.trim()) {
    localStorage.setItem(STORAGE_KEY + '_name', n.trim());
    document.getElementById('childNameDisplay').textContent = n.trim();
    cloudPost({ action: 'changeName', name: n.trim() });
  }
}

// ── Data ──
function getEntries() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function pickMood(btn) {
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedMood = btn.dataset.mood;
}

function saveEntry() {
  const date = document.getElementById('entryDate').value;
  const app = parseInt(document.getElementById('entryApp').value) || 0;
  const read = parseInt(document.getElementById('entryRead').value) || 0;

  if (!date) { alert('Bitte Datum auswählen!'); return; }
  if (app === 0 && read === 0 && !selectedMood) { alert('Bitte mindestens Minuten oder Stimmung eintragen!'); return; }

  const entries = getEntries();
  const existing = entries.findIndex(e => e.date === date);
  if (existing >= 0) {
    if (!confirm('Es gibt schon einen Eintrag für dieses Datum. Überschreiben?')) return;
    entries.splice(existing, 1);
  }

  const entry = { date, app, read, mood: selectedMood || '–', id: Date.now() };
  entries.push(entry);
  entries.sort((a, b) => b.date.localeCompare(a.date));
  saveEntries(entries);

  // Cloud save
  cloudPost({ action: 'save', entry });

  document.getElementById('entryApp').value = '';
  document.getElementById('entryRead').value = '';
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  selectedMood = null;

  render();
}

function deleteEntry(id) {
  if (!confirm('Eintrag löschen?')) return;
  const entries = getEntries().filter(e => e.id !== id);
  saveEntries(entries);
  cloudPost({ action: 'delete', id });
  render();
}

function render() {
  const entries = getEntries();
  const container = document.getElementById('logContent');

  // Week stats
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay() + 1);
  const weekKey = weekStart.toISOString().slice(0, 10);
  const weekEntries = entries.filter(e => e.date >= weekKey);

  document.getElementById('statWeekApp').textContent = weekEntries.reduce((s, e) => s + (e.app || 0), 0);
  document.getElementById('statWeekRead').textContent = weekEntries.reduce((s, e) => s + (e.read || 0), 0);
  document.getElementById('statTotal').textContent = entries.length;

  // Streak
  let streak = 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const checkDate = new Date(today);
  const dateSet = new Set(entries.map(e => e.date));
  if (!dateSet.has(checkDate.toISOString().slice(0,10))) {
    checkDate.setDate(checkDate.getDate() - 1);
  }
  while (dateSet.has(checkDate.toISOString().slice(0,10))) {
    streak++;
    checkDate.setDate(checkDate.getDate() - 1);
  }
  document.getElementById('statStreak').textContent = streak;

  // Table
  if (entries.length === 0) {
    container.innerHTML = '<div class="log-empty">Noch keine Einträge — trag deine erste Übung ein! 🚀</div>';
    return;
  }

  let html = `<table class="log-table">
    <thead><tr><th>Datum</th><th>App</th><th>Lesen</th><th>Stimmung</th><th></th></tr></thead><tbody>`;

  entries.forEach(e => {
    const d = new Date(e.date);
    const dayStr = d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
    html += `<tr>
      <td>${dayStr}</td>
      <td class="min-app">${e.app || 0} Min</td>
      <td class="min-read">${e.read || 0} Min</td>
      <td class="mood-cell">${e.mood}</td>
      <td><button class="delete-btn" onclick="deleteEntry(${e.id})">✕</button></td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

function exportJSON() {
  const data = {
    name: localStorage.getItem(STORAGE_KEY + '_name') || 'Kind',
    entries: getEntries(),
    exported: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `uebungstagebuch_${data.name.toLowerCase().replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.entries && Array.isArray(data.entries)) {
        if (!confirm(`${data.entries.length} Einträge importieren? Bestehende Daten werden überschrieben.`)) return;
        saveEntries(data.entries);
        if (data.name) {
          localStorage.setItem(STORAGE_KEY + '_name', data.name);
          document.getElementById('childNameDisplay').textContent = data.name;
        }
        render();
        data.entries.forEach(entry => cloudPost({ action: 'save', entry }));
        alert('Import erfolgreich! ✅');
      } else {
        alert('Datei hat kein gültiges Format.');
      }
    } catch { alert('Fehler beim Lesen der Datei.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAll() {
  if (!confirm('Wirklich ALLE Einträge löschen? Das kann nicht rückgängig gemacht werden!')) return;
  localStorage.removeItem(STORAGE_KEY);
  cloudPost({ action: 'clearAll' });
  render();
}
</script>
</body>
</html>
